name: Cashbook CI and deploy
on:
  push:
    branches: [main, backend_local, frontend_local, database_local]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cashbook_test
          POSTGRES_PASSWORD: cashbook_test
          POSTGRES_DB: cashbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cashbook_test -d cashbook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend syntax
        run: python -m compileall -q backend
      - name: Backend API and accounting tests
        working-directory: backend
        env:
          CASHBOOK_TEST_DATABASE_URL: postgresql://cashbook_test:cashbook_test@127.0.0.1:5432/cashbook_test
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -p 'test_*.py'
      - name: Frontend tests, typecheck and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Browser regression tests against real API and PostgreSQL
        env:
          CASHBOOK_E2E_DATABASE_URL: postgresql://cashbook_test:cashbook_test@127.0.0.1:5432/cashbook_e2e
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect('postgresql://cashbook_test:cashbook_test@127.0.0.1:5432/cashbook_test', autocommit=True) as db:
              db.execute('CREATE DATABASE cashbook_e2e')
          PY
          python backend/e2e_server.py > /tmp/cashbook-e2e-api.log 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/cashbook-e2e-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:5173/api/session
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Deployment script syntax
        run: bash -n deploy/backup.sh deploy/release.sh deploy/ci-entrypoint.sh
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://${{ vars.DEPLOY_HOST }}
    concurrency:
      group: cashbook-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy checked commit over pinned SSH connection
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then echo "Superseded commit; skipping deployment."; exit 0; fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/cashbook
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cashbook ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/cashbook' EXIT
          git archive --format=tar.gz HEAD > release.tar.gz
          ssh -i ~/.ssh/cashbook -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "ubuntu@$DEPLOY_HOST" "deploy $GITHUB_SHA" < release.tar.gz
          curl --fail --retry 3 --retry-delay 5 "https://$DEPLOY_HOST/api/session"
